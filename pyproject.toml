[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-flow-auditor"
version = "1.0.0"
description = "Reusable Django app for network flow parsing, diffing, and approval auditing across Cisco ASA, Juniper SRX, and custom rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Travis Pickle" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Security",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14.0",
    "celery>=5.3.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.8.0",
    "ruff>=0.4.0",
    "vulture>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flow_auditor"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/flow_auditor --cov-report=term-missing"


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["flow_auditor"]

[tool.vulture]
min_confidence = 80
paths = ["src/flow_auditor"]
exclude = ["*migrations*"]

[tool.coverage.run]
source = ["src/flow_auditor"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 80

